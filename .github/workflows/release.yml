name: release

# Tag pushes (vX.Y.Z) publish a GitHub Release. A manual run builds the same
# assets but only uploads them as workflow artifacts unless publish=true.
on:
  push:
    tags: ["v*.*.*"]
  # Dry run (artifacts only, never publishes: publishing needs a tag push or
  # publish=true) when the release pipeline or the app changes.
  pull_request:
    paths: [".github/workflows/release.yml", "apps/rp_console/**", "deploy/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release (otherwise dry run: artifacts only). Checked first: the tag must exist on this commit and match the version."
        type: boolean
        default: false
      tag:
        description: "Existing tag vX.Y.Z to publish (= workspace version; run the workflow from that tag). Leave empty for a dry run."
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide in seconds whether this run publishes, and refuse a publish that
  # would only fail (or ship the wrong code) after every build has run.
  preflight:
    name: preflight (${{ github.event_name }})
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tag: ${{ steps.check.outputs.tag }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the release inputs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish && 'true' || 'false' }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          HAS_SIGNING_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' && 'true' || 'false' }}
        run: |
          tag=$([ "$EVENT" = push ] && echo "$REF_NAME" || echo "$TAG_INPUT")
          tag=${tag// /}
          export TAG_SHA="" RELEASE_EXISTS=false
          if [ -n "$tag" ]; then
            git fetch -q --force --tags origin
            TAG_SHA=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
            gh release view "$tag" >/dev/null 2>&1 && RELEASE_EXISTS=true
          fi
          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          export CARGO_VERSION
          # pipefail: without it the step takes tee's status and a refusal passes.
          set -o pipefail
          bash deploy/release-preflight.sh | tee -a "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        target:
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --locked --version 0.24.0
      - name: Test before packaging
        run: cargo test --workspace --locked
      - name: Package with the same script users install with
        run: bash deploy/install.sh --package-only dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/rp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Installable test builds of the console app. Both end up in dist/ before
  # SHA256SUMS, so they are covered by the minisign signature too.
  android:
    name: android APK (signed)
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Version
        id: v
        run: bash apps/rp_console/tool/app_version.sh "${{ needs.preflight.outputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RP_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: No release keystore
        if: env.KEYSTORE_B64 == ''
        run: >-
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with the debug key
          (installable, but not upgradable to a release-signed build)"
      - name: Build APK
        working-directory: apps/rp_console
        env:
          RP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --build-name "${{ steps.v.outputs.name }}" --build-number "${{ github.run_number }}"
      - name: Verify the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=apps/rp_console/build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            [ -z "$KEYSTORE_B64" ] || { echo "::error::a release keystore is configured but the APK is debug-signed"; exit 1; }
            suffix=-debug-signed
          else
            suffix=
          fi
          mkdir -p dist
          cp "$apk" "dist/rp-security-${{ steps.v.outputs.name }}${suffix}.apk"
          ls -la dist
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (signed with IOS_* secrets, else unsigned for sideloading)
    needs: preflight
    runs-on: macos-15
    env:
      P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      BUNDLE_ID: com.jesttestteam.rp.rpConsole
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Version
        id: v
        run: bash apps/rp_console/tool/app_version.sh "${{ needs.preflight.outputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: Signing identity and profile
        id: sign
        if: env.P12_B64 != '' && env.PROFILE_B64 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bash apps/rp_console/tool/ios_ci_signing.sh setup
      - name: Unsigned build (no IOS_* secrets)
        if: steps.sign.outcome != 'success'
        run: >-
          echo "::notice::No iOS signing secrets, so this IPA is unsigned. Sign and install it with
          your Apple ID using Sideloadly or AltStore, or use scripts/ios-device-install.sh with the iPhone attached."
      - name: Build IPA
        working-directory: apps/rp_console
        run: |
          flutter pub get
          if [ "${{ steps.sign.outcome }}" = success ]; then
            flutter build ipa --release --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" \
              --build-name "${{ steps.v.outputs.name }}" --build-number "${{ github.run_number }}"
          else
            flutter build ipa --release --no-codesign \
              --build-name "${{ steps.v.outputs.name }}" --build-number "${{ github.run_number }}"
          fi
      - name: Package and verify
        run: bash apps/rp_console/tool/ios_ci_signing.sh package "${{ steps.v.outputs.name }}" "${{ steps.sign.outcome == 'success' && 'signed' || 'unsigned' }}"
      - name: Remove the keychain and profile
        if: always()
        run: bash apps/rp_console/tool/ios_ci_signing.sh cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: dist/*.ipa
          if-no-files-found: error

  assemble:
    name: checksums, SBOM, ${{ needs.preflight.outputs.mode }}
    needs: [preflight, build, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Console app test builds (APK, IPA)
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          cargo cyclonedx --format json --all
          mkdir -p sbom && find crates -name '*.cdx.json' -exec cp {} sbom/ \;
          tar -czf dist/sbom.tar.gz -C sbom .
      - name: Add installers
        run: cp deploy/install.sh deploy/install.ps1 dist/
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: this build is unsigned and cannot be published"
            exit 0
          fi
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          cargo run -q --release -p rp-probe -- release sign --secret-key-file "$RUNNER_TEMP/minisign.key" \
            --password-env MINISIGN_PASSWORD --file dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/minisign.key"
          test -f deploy/minisign.pub && cargo run -q --release -p rp-probe -- release verify \
            --public-key-file deploy/minisign.pub --file dist/SHA256SUMS
      - name: Build provenance attestation
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/rp-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Publish GitHub Release
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag '$TAG'"; exit 1; }
          # Devices refuse unsigned updates; so does the release.
          [[ -f dist/SHA256SUMS.minisig ]] || { echo "refusing to publish an unsigned release"; exit 1; }
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
