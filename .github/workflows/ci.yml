name: ci

on:
  push:
    branches: [main, pi-wifi-flash]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: robot (static, unit, cli, installer, security)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Robot suites
        run: bash test/run.sh static unit cli installer security
      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-linux
          path: test/results/
          retention-days: 14

  integration:
    name: robot (integration, network namespaces)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nftables and iproute2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iproute2
      - name: Robot integration suites (root, isolated network namespaces)
        # Root inside isolated namespaces; tests skip themselves when not root.
        run: sudo -E env "PATH=$PATH" RP_ALLOW_ROOT=1 bash test/run.sh integration
      - name: Hand results back to the runner user (they were written as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" test target || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-integration
          path: test/results/
          retention-days: 14

  hwsim:
    name: robot (real AP on mac80211_hwsim virtual radios)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hostapd, wpa_supplicant, dnsmasq, iw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hostapd wpasupplicant dnsmasq-base iw udhcpc
      - name: Load mac80211_hwsim if this runner kernel ships it
        # Optional: hosted runner kernels may not package the module. The suite
        # then skips itself; real-radio runs happen on the device.
        run: |
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra for $(uname -r)"
          if sudo modprobe mac80211_hwsim radios=0; then echo "hwsim available"; sudo modprobe -r mac80211_hwsim; else echo "::notice::mac80211_hwsim unavailable on $(uname -r); hwsim suite will skip"; fi
      - name: Robot hwsim suite (skips if the module is unavailable)
        run: sudo -E env "PATH=$PATH" RP_ALLOW_ROOT=1 bash test/run.sh hwsim
      - name: Hand results back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" test target || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-hwsim
          path: test/results/
          retention-days: 14

  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [armv7-unknown-linux-gnueabihf, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        # zig 0.13 / zigbuild 0.19 reject rustc's --fix-cortex-a53-843419 for aarch64.
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --locked --version 0.24.0
      - name: Package
        run: bash deploy/install.sh --package-only dist --target ${{ matrix.target }}
      - name: Binary size budget (the console API must stay small on a Pi 2B)
        run: |
          f=target/${{ matrix.target }}/release/rp-api
          size=$(stat -c %s "$f")
          echo "rp-api: $size bytes"
          test "$size" -le 8388608
      - uses: actions/upload-artifact@v4
        with:
          name: rp-${{ matrix.target }}
          path: dist/
          retention-days: 7

  windows-installer:
    name: robot (install.ps1 on Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Robot PowerShell suites
        shell: pwsh
        run: ./test/run.ps1 -Tags pwsh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-windows
          path: test/results/
          retention-days: 14
