[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jest-Test-Team/rp_app"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
similar = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
