# Managed by rpctl — local edits will be overwritten.
interface=wlan0
driver=nl80211
ssid=rp-test-iot
country_code=TW
ieee80211d=1
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# The passphrase lives only in this root-only file (rpctl ap set-passphrase).
wpa_psk_file=/etc/rp/ap.psk
# Clients cannot talk to each other over the air.
ap_isolate=1
ignore_broadcast_ssid=0
