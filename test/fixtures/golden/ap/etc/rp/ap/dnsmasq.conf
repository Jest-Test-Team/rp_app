# Managed by rpctl — local edits will be overwritten.
# DHCP only: port=0 disables dnsmasq's DNS server (rp-dns owns port 53).
port=0
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-authoritative
dhcp-range=198.51.100.10,198.51.100.244,255.255.255.0,12h
dhcp-option=option:router,198.51.100.1
dhcp-option=option:dns-server,1.1.1.1,9.9.9.9
dhcp-leasefile=/var/lib/rp/ap/dnsmasq.leases
log-dhcp
